  <rect x="18" y="28" width="20" height="2" fill="#9a9a9a"/>
  <rect x="14" y="33" width="36" height="7" fill="#c53b2b"/>
  <rect x="18" y="44" width="24" height="2" fill="#9a9a9a"/>
</svg>
